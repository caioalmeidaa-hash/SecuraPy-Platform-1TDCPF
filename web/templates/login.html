{% extends "base.html" %}
{% block titulo %}Entrar · SecuraPy{% endblock %}
{% block conteudo %}
<section class="cartao login">
  <h1>Acesso do operador</h1>
  {% if erro %}<p class="flash erro">{{ erro }}</p>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" required maxlength="254"></label>
    <label>Senha <input type="password" name="senha" required maxlength="256"></label>
    <button>Entrar</button>
  </form>
</section>
{% endblock %}
